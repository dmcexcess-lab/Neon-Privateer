name: Build and Deploy Neon Privateer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neon-privateer-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild Privateer generated menu atlas
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/privateer_ui
          cat             art/privateer_ui_atlas_0.b64             art/privateer_ui_atlas_1.b64             art/privateer_ui_atlas_2.b64             art/privateer_ui_atlas_3.b64             | base64 --decode > assets/privateer_ui/privateer_ui_atlas.jpg
          test -s assets/privateer_ui/privateer_ui_atlas.jpg
          file assets/privateer_ui/privateer_ui_atlas.jpg | grep -q '390x1228'

      - name: Download Godot editor and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot /tmp/templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Build native Privateer menu texture
        shell: bash
        run: |
          set -euxo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"             --headless --path . --script res://tools/BuildPrivateerArt.gd
          test -s assets/privateer_ui/privateer_ui_atlas.res

      - name: Import Privateer soundtrack and test beta page
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --editor --path . --quit
          python3 tools/SyncFirewallSource.py
          git diff --exit-code -- neon-firewall/scripts
          node neon-breach/src/build-standalone.mjs
          git diff --exit-code -- neon-breach/index.html
          node --test tests/fullscreen.test.mjs tests/breach_audio.test.mjs
          node --test tests/beta_feedback.test.mjs
          node --test tests/neon_breach.test.mjs tests/breach_dungeon.test.mjs tests/breach_spawns.test.mjs
          python3 -m unittest discover -s tests -p 'test_beta_wrapper.py'

      - name: Test native Firewall and Privateer career integration
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$ENGINE" --headless --editor --path neon-firewall --quit
          XDG_DATA_HOME="$RUNNER_TEMP/firewall-tests" "$ENGINE" --headless --path neon-firewall --script res://tests/SmokeTest.gd 2>&1 | tee /tmp/firewall-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|FIREWALL FAIL' /tmp/firewall-tests.log; then exit 1; fi
          grep -q 'NEON FIREWALL OK' /tmp/firewall-tests.log
          XDG_DATA_HOME="$RUNNER_TEMP/firewall-integration" "$ENGINE" --headless --path . --script res://tests/FirewallIntegrationTest.gd 2>&1 | tee /tmp/firewall-integration.log
          if grep -E 'SCRIPT ERROR|Parse Error|FIREWALL INTEGRATION FAIL' /tmp/firewall-integration.log; then exit 1; fi
          grep -q 'NEON FIREWALL INTEGRATION OK' /tmp/firewall-integration.log

      - name: Test native covert careers, ground operations and weapon systems
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/covert-tests" timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path . --script res://tests/CovertIntegrationTest.gd 2>&1 | tee /tmp/covert-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|COVERT FAIL' /tmp/covert-tests.log; then exit 1; fi
          grep -q 'NEON COVERT OK' /tmp/covert-tests.log

      - name: Test Privateer soundtrack state and real loops
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/PrivateerMusicTest.gd 2>&1 | tee /tmp/privateer-music.log
          if grep -E 'SCRIPT ERROR|Parse Error|PRIVATEER MUSIC FAIL' /tmp/privateer-music.log; then exit 1; fi
          grep -q 'NEON PRIVATEER MUSIC OK' /tmp/privateer-music.log

      - name: Run Privateer smoke test
        shell: bash
        run: |
          set -euxo pipefail
          LOG=/tmp/privateer-smoke.log
          set +e
          timeout 180s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"             --headless --path . --script res://tests/SmokeTest.gd 2>&1 | tee "$LOG"
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then exit "$GODOT_EXIT"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|PRIVATEER SMOKE FAIL' "$LOG"; then exit 1; fi
          grep -q 'NEON PRIVATEER PRODUCTION CLOSURE OK' "$LOG"
          grep -q 'NEON PRIVATEER SMOKE OK' "$LOG"

      - name: Import Classic audio resources
        run: |
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --editor --path neon-driftline-classic --quit

      - name: Run Classic Neon Driftline smoke test
        shell: bash
        run: |
          set -euxo pipefail
          LOG=/tmp/classic-smoke.log
          set +e
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path neon-driftline-classic --script res://tests/SmokeTest.gd 2>&1 | tee "$LOG"
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then exit "$GODOT_EXIT"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|SMOKE FAIL' "$LOG"; then exit 1; fi
          grep -q 'NEON DRIFTLINE SMOKE OK' "$LOG"

      - name: Test persistent Classic soundtrack
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path neon-driftline-classic --script res://tests/MusicTest.gd 2>&1 | tee /tmp/classic-music.log
          if grep -E "SCRIPT ERROR|Parse Error|MUSIC FAIL" /tmp/classic-music.log; then exit 1; fi
          grep -q "NEON DRIFTLINE MUSIC OK" /tmp/classic-music.log

      - name: Run Classic balance telemetry
        shell: bash
        run: |
          set -euxo pipefail
          LOG=/tmp/classic-balance.log
          set +e
          timeout 120s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path neon-driftline-classic --script res://tests/BalanceTest.gd 2>&1 | tee "$LOG"
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then exit "$GODOT_EXIT"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|BALANCE FAIL' "$LOG"; then exit 1; fi
          grep -q 'NEON DRIFTLINE BALANCE TELEMETRY OK' "$LOG"

      - name: Export Web and reject script errors
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web build/web/classic
          SHORT_SHA="${GITHUB_SHA:0:12}"
          BASENAME="neon-privateer-${SHORT_SHA}"
          LOG=/tmp/privateer-export.log
          set +e
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"             --headless --path . --export-release Web "build/web/${BASENAME}.html"             2>&1 | tee "$LOG"
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then exit "$GODOT_EXIT"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$LOG"; then exit 1; fi
          mv "build/web/${BASENAME}.html" build/web/index.html
          test -f "build/web/${BASENAME}.pck"

          PRIVATEER_PACK="$(realpath "build/web/${BASENAME}.pck")"
          mkdir -p /tmp/privateer-pack-empty
          (cd /tmp/privateer-pack-empty && XDG_DATA_HOME="$RUNNER_TEMP/privateer-pack-firewall" timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --main-pack "$PRIVATEER_PACK" --script res://tests/FirewallIntegrationTest.gd) 2>&1 | tee /tmp/privateer-pack-firewall.log
          if grep -E 'SCRIPT ERROR|Parse Error|FIREWALL INTEGRATION FAIL' /tmp/privateer-pack-firewall.log; then exit 1; fi
          grep -q 'NEON FIREWALL INTEGRATION OK' /tmp/privateer-pack-firewall.log

          (cd /tmp/privateer-pack-empty && XDG_DATA_HOME="$RUNNER_TEMP/privateer-pack-covert" timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --main-pack "$PRIVATEER_PACK" --script res://tests/CovertIntegrationTest.gd) 2>&1 | tee /tmp/privateer-pack-covert.log
          if grep -E 'SCRIPT ERROR|Parse Error|COVERT FAIL' /tmp/privateer-pack-covert.log; then exit 1; fi
          grep -q 'NEON COVERT OK' /tmp/privateer-pack-covert.log

          # Assert the reconstructed/generated atlas is inside the Web PCK.
          grep -a -q "privateer_ui_atlas.res" "build/web/${BASENAME}.pck"

          timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --main-pack "$(realpath "build/web/${BASENAME}.pck")" \
            --script res://tests/PrivateerMusicTest.gd 2>&1 | tee /tmp/privateer-pack-music.log
          if grep -E 'SCRIPT ERROR|Parse Error|PRIVATEER MUSIC FAIL' /tmp/privateer-pack-music.log; then exit 1; fi
          grep -q 'NEON PRIVATEER MUSIC OK' /tmp/privateer-pack-music.log

          CLASSIC_BASENAME="neon-driftline-classic-${SHORT_SHA}"
          CLASSIC_LOG=/tmp/classic-export.log
          set +e
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path neon-driftline-classic --export-release Web "../build/web/classic/${CLASSIC_BASENAME}.html" \
            2>&1 | tee "$CLASSIC_LOG"
          CLASSIC_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$CLASSIC_EXIT" -ne 0 ]; then exit "$CLASSIC_EXIT"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$CLASSIC_LOG"; then exit 1; fi
          mv "build/web/classic/${CLASSIC_BASENAME}.html" build/web/classic/index.html
          test -f "build/web/classic/${CLASSIC_BASENAME}.pck"
          # Run the real soundtrack test against the EXPORTED pack, so a missing
          # imported song, controller or loop flag fails deployment.
          timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --main-pack "$(realpath "build/web/classic/${CLASSIC_BASENAME}.pck")" \
            --script res://tests/MusicTest.gd 2>&1 | tee /tmp/classic-pack-music.log
          if grep -E 'SCRIPT ERROR|Parse Error|MUSIC FAIL' /tmp/classic-pack-music.log; then exit 1; fi
          grep -q 'NEON DRIFTLINE MUSIC OK' /tmp/classic-pack-music.log

          mkdir -p build/web/firewall
          FIREWALL_BASENAME="neon-firewall-${SHORT_SHA}"
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --editor --path neon-firewall --export-release Web "../build/web/firewall/${FIREWALL_BASENAME}.html" 2>&1 | tee /tmp/firewall-export.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/firewall-export.log; then exit 1; fi
          mv "build/web/firewall/${FIREWALL_BASENAME}.html" build/web/firewall/index.html
          test -s "build/web/firewall/${FIREWALL_BASENAME}.pck"
          FIREWALL_PACK="$(realpath "build/web/firewall/${FIREWALL_BASENAME}.pck")"
          mkdir -p /tmp/firewall-pack-empty
          (cd /tmp/firewall-pack-empty && XDG_DATA_HOME="$RUNNER_TEMP/firewall-pack" timeout 60s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --main-pack "$FIREWALL_PACK" --script res://tests/SmokeTest.gd) 2>&1 | tee /tmp/firewall-pack-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|FIREWALL FAIL' /tmp/firewall-pack-test.log; then exit 1; fi
          grep -q 'NEON FIREWALL OK' /tmp/firewall-pack-test.log

          mkdir -p build/web/breach
          cp neon-breach/index.html build/web/breach/index.html
          test -s build/web/breach/index.html
          touch build/web/.nojekyll

      - name: Include optional advertising panel
        shell: bash
        run: |
          mkdir -p build/web/ad-support
          cp monetization/*.html build/web/ad-support/
          python3 tools/WrapClassicWebAds.py build/web/classic/index.html "${GITHUB_SHA:0:12}"
          python3 tools/WrapPrivateerBeta.py build/web/index.html "${GITHUB_SHA:0:12}"
          python3 tools/WrapPrivateerBeta.py build/web/breach/index.html "${GITHUB_SHA:0:12}" breach
          python3 tools/WrapPrivateerBeta.py build/web/firewall/index.html "${GITHUB_SHA:0:12}" firewall

      - name: Keep downloadable Web build
        uses: actions/upload-artifact@v4
        with:
          name: neon-privateer-web
          path: build/web

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
