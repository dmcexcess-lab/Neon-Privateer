name: Build Classic Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "neon-driftline-classic/**"
      - ".github/workflows/build-classic-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: stable
      APP_DIR: neon-driftline-classic
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/neon-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Install SDK targets
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download Godot and matching export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 4 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot /tmp/templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          test -s "/tmp/templates/templates/android_source.zip"
      - name: Install Android Gradle source template
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$APP_DIR/android"
          unzip -q "/tmp/templates/templates/android_source.zip" -d "$APP_DIR/android"
          # The Godot export archive is rooted at gradlew, but an installed
          # Gradle template lives under res://android/build.
          if [ -f "$APP_DIR/android/gradlew" ]; then
            mkdir -p "$APP_DIR/android/build"
            find "$APP_DIR/android" -mindepth 1 -maxdepth 1 ! -name build -exec mv -t "$APP_DIR/android/build" {} +
          fi
          if [ ! -f "$APP_DIR/android/build/gradlew" ]; then
            echo "Source template layout:"; find "$APP_DIR/android" -maxdepth 3 -type f | head -30
            exit 1
          fi
          chmod +x "$APP_DIR/android/build/gradlew"
      - name: Install pinned Poing Studios AdMob Android addon
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="v5.1.0"
          ROOT="https://github.com/poingstudios/godot-admob-plugin/releases/download/${VERSION}"
          curl -fL --retry 4 "${ROOT}/poing-godot-admob-v5.1.0.zip" -o /tmp/poing-editor.zip
          curl -fL --retry 4 "${ROOT}/android-template-v4.7.2.zip" -o /tmp/poing-android.zip
          mkdir -p /tmp/poing-editor /tmp/poing-android
          unzip -q /tmp/poing-editor.zip -d /tmp/poing-editor
          unzip -q /tmp/poing-android.zip -d /tmp/poing-android
          PLUGIN_CFG="$(find /tmp/poing-editor -type f -path '*/addons/admob/plugin.cfg' -print -quit)"
          test -n "$PLUGIN_CFG"
          mkdir -p "$APP_DIR/addons"
          cp -R "$(dirname "$PLUGIN_CFG")" "$APP_DIR/addons/admob"
          NATIVE_GD="$(find /tmp/poing-android -type f -name 'poing_godot_admob_*.gd' -print -quit)"
          if [ -z "$NATIVE_GD" ]; then
            echo "Missing plugin descriptor; Android binary archive layout follows:"
            find /tmp/poing-android -maxdepth 5 -type f | head -70
            exit 1
          fi
          BIN_ROOT="$(dirname "$(dirname "$NATIVE_GD")")"
          mkdir -p "$APP_DIR/addons/admob/android/bin"
          cp -R "$BIN_ROOT"/. "$APP_DIR/addons/admob/android/bin/"
          test -n "$(find "$APP_DIR/addons/admob/android/bin" -name 'poing_godot_admob_*.gd' -print -quit)"
          echo "Installed native AdMob library descriptors:"
          find "$APP_DIR/addons/admob/android/bin" -name 'poing_godot_admob_*.gd' -print | head -20
          cat >> "$APP_DIR/project.godot" <<'CFG'

          [editor_plugins]
          enabled=PackedStringArray("res://addons/admob/plugin.cfg")
          CFG
      - name: Create original Android launcher icon
        run: |
          python3 "$APP_DIR/tools/generate_android_icon.py"
          test -s "$APP_DIR/assets/android/icon.png"
      - name: Set SDK and Java paths for Godot
        shell: bash
        run: |
          cat > /tmp/neon-android-settings.gd <<'GD'
          extends SceneTree
          func _initialize() -> void:
              var settings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.save()
              quit()
          GD
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --editor --path "$APP_DIR" --script /tmp/neon-android-settings.gd
      - name: Import project and validate original gameplay
        run: |
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --editor --path "$APP_DIR" --quit
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "$APP_DIR" --script res://tests/SmokeTest.gd | tee /tmp/classic-android-smoke.log
          grep -q 'NEON DRIFTLINE SMOKE OK' /tmp/classic-android-smoke.log
      - name: Generate disposable Android debug keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/neon-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Neon Driftline Test,O=Development,C=US"
          mkdir -p "$APP_DIR/build/android"
      - name: Export test APK (test AdMob IDs, never production ads)
        shell: bash
        run: |
          set -euxo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "$APP_DIR" --export-debug "Android APK" build/android/neon-driftline-classic.apk 2>&1 | tee /tmp/neon-android-export.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/neon-android-export.log; then exit 1; fi
          test -s "$APP_DIR/build/android/neon-driftline-classic.apk"
          unzip -t "$APP_DIR/build/android/neon-driftline-classic.apk" >/dev/null
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-driftline-classic-debug-apk
          path: neon-driftline-classic/build/android/neon-driftline-classic.apk
          if-no-files-found: error
      - name: Configure release signing (only if secrets available)
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$ALIAS" ] && [ -n "$PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > /tmp/neon-upload.keystore
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'No release key configured: skipping signed AAB.'
          fi
      - name: Export signed Android App Bundle for Play internal testing
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/neon-upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path "$APP_DIR" --export-release "Android AAB" build/android/neon-driftline-classic.aab
          test -s "$APP_DIR/build/android/neon-driftline-classic.aab"
      - name: Upload signed Play-testing AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neon-driftline-classic-signed-aab
          path: neon-driftline-classic/build/android/neon-driftline-classic.aab
          if-no-files-found: error
